<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Billing Portal – Usage & Subscriptions</title>
  <link rel="stylesheet" href="/css/app.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">UB</div>
        <span>UsageBill</span>
      </div>
      <nav class="nav-menu">
        <button class="nav active" data-page="dashboard">Dashboard</button>
        <button class="nav" data-page="plans">Plans & Pricing</button>
        <button class="nav" data-page="usage">Usage</button>
        <button class="nav" data-page="invoices">Invoices</button>
        <button class="nav" data-page="settings">Settings</button>
      </nav>
      <div class="sidebar-footer">
        <div class="user-chip">
          <div class="avatar">AC</div>
          <div>
            <div class="name">Acme Corp</div>
            <div class="role">demo@acme.com</div>
          </div>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="left">
          <h2 id="pageTitle">Dashboard</h2>
        </div>
        <div class="right">
          <button id="themeBtn" class="icon-btn" title="Toggle theme">🌓</button>
          <button id="refreshBtn" class="icon-btn" title="Refresh">🔄</button>
        </div>
      </header>
      <section id="content" class="content"></section>
    </main>
  </div>

  <div id="toast-container"></div>
  <script src="/js/app.js"></script>
</body>
</html>
